<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسم و فامیل آنلاین دانیال کد </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#F3EFE6; --panel:#FFFFFF; --ink:#22261F; --muted:#71786A; --line:#E4DFD0;
    --brand:#33513F; --brand-deep:#233727; --accent:#E2A63F; --accent-deep:#C4872A;
    --bad:#B5473A; --good:#33513F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif; }
  body{ padding:28px 16px 60px; }
  .wrap{ max-width:880px; margin:0 auto; }
  header{ text-align:center; margin-bottom:22px; }
  header h1{ font-size:26px; margin:0 0 6px; }
  header p{ margin:0; color:var(--muted); font-size:14px; }
  .layout{ display:grid; grid-template-columns:1fr 240px; gap:18px; align-items:start; }
  @media (max-width:680px){ .layout{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:0 18px 40px -28px rgba(30,35,25,0.35); }
  .badge{ display:inline-block; font-size:12.5px; font-weight:700; color:var(--brand); background:#E9F0EA; border-radius:999px; padding:4px 12px; margin-bottom:12px; }
  input[type=text]{ width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:14.5px; outline:none; background:#FBFAF6; color:var(--ink); }
  input[type=text]:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(226,166,63,0.22); }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:700; font-size:14.5px; padding:11px 18px; }
  .btn-primary{ background:var(--accent); color:#2A1C05; }
  .btn-primary:hover{ background:var(--accent-deep); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:#EEEAE0; color:var(--ink); }
  .status-line{ font-size:13px; color:var(--muted); margin-top:10px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:5px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .code-box{
    font-family:monospace; font-size:13px; background:#F3EFE6; border:1px dashed var(--line);
    border-radius:10px; padding:10px 12px; word-break:break-all; user-select:all;
  }
  .letter-chip{ width:56px; height:56px; border-radius:14px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; flex:none; }
  .play-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .timer{ font-variant-numeric:tabular-nums; font-size:22px; font-weight:700; color:var(--brand); }
  .timer.low{ color:var(--bad); }
  .cat-grid{ display:grid; gap:10px; }
  .cat-row label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:4px; }
  table.score-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  table.score-table th, table.score-table td{ border-bottom:1px solid var(--line); padding:7px 6px; text-align:center; }
  table.score-table th:first-child, table.score-table td:first-child{ text-align:right; }
  .pt-10{ color:var(--good); font-weight:700; }
  .pt-5{ color:var(--accent-deep); font-weight:700; }
  .pt-0{ color:var(--muted); }
  .side h3{ font-size:14px; margin:0 0 10px; }
  .player-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .player-row:last-child{ border-bottom:none; }
  .player-row .name{ display:flex; align-items:center; gap:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .player-row .score{ font-weight:700; color:var(--brand); }
  .hint{ font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.7; }
  .conn-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:#C4872A; margin-left:6px; }
  .conn-dot.ok{ background:#33513F; }
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tabs button{ flex:1; background:#EEEAE0; color:var(--ink); }
  .tabs button.active{ background:var(--brand); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>اسم و فامیل آنلاین</h1>
    <p>بدون سرور، بدون حساب — مستقیم مرورگر به مرورگر (WebRTC)</p>
  </header>
  <div id="root"><div class="panel">در حال آماده‌سازی…</div></div>
</div>

<script>
  /* ====================================================================
     تنظیمات Firebase (فقط برای بخش «بازی‌های آنلاین الان» لازمه)
     ====================================================================
     این بخش کاملاً اختیاریه: اگه پرش نکنی، بقیه‌ی بازی (ساخت روم، دادن کد
     به دوستات، وصل‌شدن با کد) عادی کار می‌کنه؛ فقط لیست عمومی «بازی‌های
     آنلاین الان» غیرفعال می‌مونه.

     برای فعال کردنش (رایگانه، حدود ۵ دقیقه طول می‌کشه):
       ۱) برو به https://console.firebase.google.com و با جیمیلت وارد شو.
       ۲) دکمه‌ی "Add project" رو بزن، یه اسم دلخواه بده (Analytics لازم نیست).
       ۳) از منوی سمت چپ: Build > Realtime Database > "Create Database".
          حالتش (mode) رو "Test mode" بذار.
       ۴) بالای صفحه، آیکون چرخ‌دنده > "Project settings" رو بزن. پایین
          صفحه، بخش "Your apps" را پیدا کن و روی آیکون </> (Web) بزن تا
          یه اپ وب بسازی.
       ۵) یه شیء (object) به اسم firebaseConfig بهت نشون داده می‌شه؛ دقیقاً
          همون رو کپی کن و کل شیء زیر رو باهاش عوض کن.
     ==================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyBm2gMMt35N0mdvWPGXfns_X4kLt_d0v9Q",
    authDomain: "esm-famil-33228.firebaseapp.com",
    databaseURL: "https://esm-famil-33228-default-rtdb.firebaseio.com",
    projectId: "esm-famil-33228"
  };

  let fbReady = false;
  let roomsRef = null;
  try{
    if(firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE_') !== 0 && typeof firebase !== 'undefined'){
      firebase.initializeApp(firebaseConfig);
      roomsRef = firebase.database().ref('rooms');
      fbReady = true;
    }
  }catch(e){ console.warn('Firebase init failed', e); }

  // سرورهای STUN/TURN شخصی خودمون (Metered.ca) — TURN باعث می‌شه اگه اتصال مستقیم بین
  // دو نت مختلف ممکن نبود (مثلاً پشت فیلترینگ یا NAT سخت‌گیر)، ترافیک از یه سرور واسط رد بشه
  // تا دو نفر روی اینترنت‌های متفاوت هم بتونن بدون هات‌اسپات مشترک بازی کنن.
  const PEER_CONFIG = {
    config: {
      iceServers: [
        { urls: 'stun:stun.relay.metered.ca:80' },
        { urls: 'turn:global.relay.metered.ca:80', username: '8708e49034d4e1e667d3aea0', credential: '2gn9sGyrcrnkUQ/P' },
        { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '8708e49034d4e1e667d3aea0', credential: '2gn9sGyrcrnkUQ/P' },
        { urls: 'turn:global.relay.metered.ca:443', username: '8708e49034d4e1e667d3aea0', credential: '2gn9sGyrcrnkUQ/P' },
        { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '8708e49034d4e1e667d3aea0', credential: '2gn9sGyrcrnkUQ/P' }
      ]
    }
  };

  const CATEGORIES = [
    { key:'name',   label:'نام' },
    { key:'family', label:'نام خانوادگی' },
    { key:'city',   label:'شهر' },
    { key:'animal', label:'حیوان' },
    { key:'food',   label:'غذا' },
    { key:'color',  label:'رنگ' },
  ];
  const LETTERS = ['ا','ب','پ','ت','ج','چ','د','ر','ز','س','ش','ص','ط','ع','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];
  const ROUND_MS = 60000;
  const COUNTDOWN_MS = 20000; // مدت شمارش معکوس قبل از شروع هر دور (میلی‌ثانیه — مثلاً 3000 = ۳ ثانیه، 5000 = ۵ ثانیه)

  const root = document.getElementById('root');

  let screen = 'landing';   // landing | connecting | room
  let isHost = false;
  let peer = null, myId = null, hostConn = null;
  const conns = [];         // host only: array of DataConnection
  let nameDraft = '';
  let roomTitleDraft = '';
  let joinCodeDraft = '';
  let joinError = '';

  // ---- لیست عمومی بازی‌های آنلاین (Firebase) ----
  let myRoomRef = null;      // مرجع روم خودمون توی دیتابیس (فقط وقتی میزبانیم)
  let roomsListener = null;  // آیا الان به تغییرات لیست روم‌ها گوش می‌دیم
  let onlineRooms = {};      // آخرین نسخه‌ی لیست روم‌های آنلاین
  let roomsSearchTerm = '';

  let state = { phase:'lobby', roundNum:0, letter:null, deadline:null, countdownEndsAt:null, players:{}, answers:{} };

  let submittedThisRound = false;
  let timerInterval = null;
  let deadlineTimer = null;
  let countdownTimeout = null;   // زمان‌بندی واقعیِ شروع دور بعد از پایان شمارش معکوس (فقط روی میزبان)
  let countdownInterval = null;  // فقط برای به‌روزرسانی نمایش عدد شمارش معکوس روی صفحه

  function norm(s){ return (s||'').trim().toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک'); }
  function startsWithLetter(word, letter){
    const w = norm(word); if(!w) return false;
    const l = norm(letter);
    if(l === 'ا') return w[0]==='ا' || w[0]==='آ' || w[0]==='أ' || w[0]==='إ';
    return w[0] === l;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function pointsFor(word, letter, allWords){
    if(!startsWithLetter(word, letter)) return 0;
    const key = norm(word);
    const count = allWords.filter(w=> norm(w)===key).length;
    return count===1 ? 10 : 5;
  }

  // ---------------- HOST-SIDE LOGIC ----------------
  function broadcastState(){
    const payload = JSON.parse(JSON.stringify(state));
    conns.forEach(c=>{ try{ if(c.open) c.send({type:'state', state: payload}); }catch(e){} });
    updateRoomInDirectory();
    render();
  }

  function handleClientMessage(conn, msg){
    const pid = conn.peer;
    if(msg.type === 'join'){
      state.players[pid] = state.players[pid] || { name: msg.name, score: 0, ready: false };
      state.players[pid].name = msg.name || state.players[pid].name;
      broadcastState();
    } else if(msg.type === 'submit'){
      if(state.phase === 'playing'){
        state.answers[pid] = { categories: msg.categories };
        broadcastState();
      }
    } else if(msg.type === 'ready'){
      handleReadyChange(pid, !!msg.ready);
      broadcastState();
    } else if(msg.type === 'requestNextRound'){
      beginCountdown();
    }
  }

  // وقتی یکی آماده/ناآماده می‌شود: اگر وسط شمارش معکوس یکی لغو کرد، شمارش متوقف می‌شود؛
  // اگر همه در لابی آماده باشند، شمارش معکوس شروع می‌شود.
  function handleReadyChange(pid, ready){
    if(!state.players[pid]) return;
    state.players[pid].ready = ready;
    if(state.phase === 'countdown' && !ready){
      state.phase = 'lobby';
      state.countdownEndsAt = null;
      if(countdownTimeout){ clearTimeout(countdownTimeout); countdownTimeout = null; }
    } else if(state.phase === 'lobby'){
      maybeStartCountdown();
    }
  }

  function maybeStartCountdown(){
    const ids = Object.keys(state.players);
    if(ids.length === 0) return;
    const allReady = ids.every(pid => state.players[pid].ready);
    if(!allReady) return;
    beginCountdown();
  }

  // شمارش معکوس را شروع می‌کند و بعد از اتمامش خودش دور را شروع می‌کند
  function beginCountdown(){
    if(state.phase === 'playing' || state.phase === 'countdown') return;
    state.phase = 'countdown';
    state.countdownEndsAt = Date.now() + COUNTDOWN_MS;
    if(countdownTimeout) clearTimeout(countdownTimeout);
    countdownTimeout = setTimeout(()=>{
      countdownTimeout = null;
      if(state.phase === 'countdown') startRound();
    }, COUNTDOWN_MS + 200);
    broadcastState();
  }

  function startRound(){
    if(state.phase === 'playing') return;
    const letter = LETTERS[Math.floor(Math.random()*LETTERS.length)];
    state.roundNum += 1;
    state.letter = letter;
    state.phase = 'playing';
    state.deadline = Date.now() + ROUND_MS;
    state.answers = {};
    submittedThisRound = false;
    broadcastState();
    scheduleFinish();
  }

  function scheduleFinish(){
    if(deadlineTimer) clearTimeout(deadlineTimer);
    const wait = Math.max(0, state.deadline - Date.now());
    deadlineTimer = setTimeout(()=>{
      if(!submittedThisRound && isHost) hostSubmit(collectFormAnswers());
      finishRound();
    }, wait + 300);
  }

  function finishRound(){
    if(state.phase !== 'playing') return;
    CATEGORIES.forEach(cat=>{
      const groups = {};
      Object.keys(state.answers).forEach(pid=>{
        const val = (state.answers[pid].categories || {})[cat.key] || '';
        if(startsWithLetter(val, state.letter)){
          const key = norm(val);
          (groups[key] = groups[key] || []).push(pid);
        }
      });
      Object.values(groups).forEach(pids=>{
        const pts = pids.length === 1 ? 10 : 5;
        pids.forEach(pid=>{
          if(state.players[pid]) state.players[pid].score = (state.players[pid].score||0) + pts;
        });
      });
    });
    state.phase = 'reveal';
    broadcastState();
  }

  function hostSubmit(categories){
    state.answers[myId] = { categories };
    submittedThisRound = true;
    broadcastState();
  }

  // ---------------- لیست عمومی بازی‌های آنلاین ----------------
  function registerRoomInDirectory(code, title){
    if(!fbReady) return;
    myRoomRef = firebase.database().ref('rooms/' + code);
    myRoomRef.set({
      title: title,
      hostName: nameDraft.trim(),
      playerCount: Object.keys(state.players).length,
      phase: state.phase,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      lastUpdate: firebase.database.ServerValue.TIMESTAMP
    });
    // اگه تب میزبان بسته بشه یا اینترنتش قطع بشه، خودش از لیست حذف می‌شه
    myRoomRef.onDisconnect().remove();
  }

  function updateRoomInDirectory(){
    if(!fbReady || !myRoomRef) return;
    myRoomRef.update({
      playerCount: Object.keys(state.players).length,
      phase: state.phase,
      lastUpdate: firebase.database.ServerValue.TIMESTAMP
    });
  }

  function unregisterRoomFromDirectory(){
    if(myRoomRef){ myRoomRef.remove(); myRoomRef = null; }
  }

  function startWatchingRooms(){
    if(!fbReady || !roomsRef || roomsListener) return;
    roomsListener = snap=>{
      onlineRooms = snap.val() || {};
      if(screen === 'landing') renderRoomsList();
    };
    roomsRef.on('value', roomsListener);
  }

  function stopWatchingRooms(){
    if(roomsRef && roomsListener){ roomsRef.off('value', roomsListener); roomsListener = null; }
  }

  function joinRoomByCode(code){
    const tabJoinBtn = document.getElementById('tabJoin');
    if(tabJoinBtn) tabJoinBtn.click();
    const codeInput = document.getElementById('joinCode');
    if(codeInput) codeInput.value = code;
    const nameInput = document.getElementById('joinName');
    if(nameInput){
      if(nameInput.value.trim()){ joinGame(); }
      else { nameInput.focus(); }
    }
  }

  // ---------------- SHARED ACTIONS ----------------
  function collectFormAnswers(){
    const out = {};
    CATEGORIES.forEach(c=>{
      const el = document.getElementById('cat_' + c.key);
      out[c.key] = el ? el.value : '';
    });
    return out;
  }

  function submitAnswers(){
    if(submittedThisRound) return;
    submittedThisRound = true;
    const categories = collectFormAnswers();
    if(isHost){ hostSubmit(categories); }
    else if(hostConn && hostConn.open){ hostConn.send({type:'submit', categories}); }

    // فرم را همین‌جا غیرفعال می‌کنیم؛ به‌جای render() کامل، تا مقادیر تایپ‌شده پاک نشوند
    CATEGORIES.forEach(c=>{
      const el = document.getElementById('cat_' + c.key);
      if(el) el.disabled = true;
    });
    const btn = document.getElementById('submitBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'ارسال شد ✓'; }
  }

  function toggleReady(){
    if(isHost){
      const cur = !!(state.players[myId] && state.players[myId].ready);
      handleReadyChange(myId, !cur);
      broadcastState();
    } else if(hostConn && hostConn.open){
      const cur = !!(state.players[myId] && state.players[myId].ready);
      hostConn.send({type:'ready', ready: !cur});
    }
  }

  function requestNextRound(){
    submittedThisRound = false;
    if(isHost){ beginCountdown(); }
    else if(hostConn && hostConn.open){ hostConn.send({type:'requestNextRound'}); }
  }

  // یک کد کوتاه و ساده برای اشتراک‌گذاری بازی می‌سازد (به‌جای شناسه‌ی طولانی پیش‌فرض PeerJS)
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // بدون حروف/ارقام شبیه‌به‌هم مثل O,0,I,1
  function generateShortCode(len){
    let code = '';
    for(let i=0;i<len;i++) code += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
    return code;
  }

  // ---------------- CONNECTION SETUP ----------------
  function createGame(){
    nameDraft = (document.getElementById('hostName')||{}).value || nameDraft;
    roomTitleDraft = (document.getElementById('hostTitle')||{}).value || roomTitleDraft;
    if(!nameDraft.trim() || !roomTitleDraft.trim()){ return; }
    stopWatchingRooms();
    screen = 'connecting'; render();
    isHost = true;
    startHostPeer(4);
  }

  function startHostPeer(codeLength){
    const shortCode = generateShortCode(codeLength);
    peer = new Peer(shortCode, PEER_CONFIG);
    peer.on('open', id=>{
      myId = id;
      state.players[myId] = { name: nameDraft.trim(), score: 0, ready: false };
      screen = 'room';
      registerRoomInDirectory(shortCode, roomTitleDraft.trim());
      render();
    });
    peer.on('connection', conn=>{
      conns.push(conn);
      conn.on('data', data=> handleClientMessage(conn, data));
      conn.on('close', ()=>{
        const idx = conns.indexOf(conn); if(idx>=0) conns.splice(idx,1);
        delete state.players[conn.peer];
        if(state.phase === 'lobby') maybeStartCountdown();
        broadcastState();
      });
    });
    peer.on('error', err=>{
      if(err && err.type === 'unavailable-id'){
        // این کد قبلاً گرفته شده؛ یک کد جدید امتحان کن
        try{ peer.destroy(); }catch(e){}
        startHostPeer(codeLength);
        return;
      }
      joinError = 'خطا در ساخت بازی: ' + (err && err.type ? err.type : 'نامشخص');
      screen = 'landing'; render();
    });
  }

  function joinGame(){
    nameDraft = (document.getElementById('joinName')||{}).value || nameDraft;
    joinCodeDraft = ((document.getElementById('joinCode')||{}).value || '').trim().toUpperCase().replace(/\s+/g,'');
    if(!nameDraft.trim() || !joinCodeDraft){ return; }
    joinError = '';
    stopWatchingRooms();
    screen = 'connecting'; render();
    isHost = false;
    peer = new Peer(PEER_CONFIG);
    peer.on('open', id=>{
      myId = id;
      hostConn = peer.connect(joinCodeDraft, { reliable:true });
      hostConn.on('open', ()=>{
        hostConn.send({type:'join', name: nameDraft.trim()});
        screen = 'room'; render();
      });
      hostConn.on('data', msg=>{
        if(msg.type === 'state'){ state = msg.state; render(); }
      });
      hostConn.on('close', ()=>{
        joinError = 'اتصال به میزبان قطع شد.';
        screen = 'landing'; render();
      });
      hostConn.on('error', ()=>{
        joinError = 'اتصال برقرار نشد. کد بازی را بررسی کنید.';
        screen = 'landing'; render();
      });
    });
    peer.on('error', err=>{
      joinError = 'خطای اتصال: ' + (err && err.type ? err.type : 'نامشخص');
      screen = 'landing'; render();
    });
  }

  // ---------------- RENDER ----------------
  // شماره‌ی دوری که الان اسکلت فرمش در صفحه ساخته شده؛ تا وقتی دور عوض نشده،
  // فرم دوباره از صفر ساخته نمی‌شود و چیزی که کاربر تایپ کرده پاک نمی‌شود.
  let playingRoundKey = null;

  function stopPlayingTimer(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    playingRoundKey = null;
  }

  function stopCountdownTimer(){
    if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
  }

  function render(){
    if(screen === 'landing'){ stopPlayingTimer(); stopCountdownTimer(); return renderLanding(); }
    if(screen === 'connecting'){ stopPlayingTimer(); stopCountdownTimer(); return renderConnecting(); }

    if(state.phase === 'playing'){
      stopCountdownTimer();
      renderPlayingSmart();
      return;
    }
    if(state.phase === 'countdown'){
      stopPlayingTimer();
      renderCountdown();
      return;
    }

    stopPlayingTimer();
    stopCountdownTimer();
    if(state.phase === 'reveal') return renderReveal();
    return renderLobby();
  }

  function renderLanding(){
    root.innerHTML = `
      <div class="panel">
        ${joinError ? `<p class="status-line" style="color:var(--bad);">${escapeHtml(joinError)}</p>` : ''}
        <div class="tabs">
          <button id="tabCreate" class="active">بازی جدید بساز</button>
          <button id="tabJoin">اتصال با کد</button>
        </div>
        <div id="paneCreate">
          <div class="field"><label>اسمت</label><input type="text" id="hostName" placeholder="مثلاً سارا" value="${escapeHtml(nameDraft)}"></div>
          <div class="field"><label>عنوان بازی (توی لیست بازی‌های آنلاین نشون داده می‌شه)</label><input type="text" id="hostTitle" placeholder="مثلاً دورهمی جمعه‌ی ما" value="${escapeHtml(roomTitleDraft)}"></div>
          <button class="btn-primary" id="createBtn">ساخت بازی و شدن میزبان</button>
          <p class="hint">تو میزبان می‌شوی؛ یک کد کوتاه به تو داده می‌شود که باید برای دوستانت بفرستی، یا بگذاری از لیست پایین پیدایش کنند.</p>
        </div>
        <div id="paneJoin" style="display:none;">
          <div class="field"><label>اسمت</label><input type="text" id="joinName" placeholder="مثلاً سارا" value="${escapeHtml(nameDraft)}"></div>
          <div class="field"><label>کد بازی</label><input type="text" id="joinCode" placeholder="کدی که میزبان فرستاده" value="${escapeHtml(joinCodeDraft)}"></div>
          <button class="btn-primary" id="joinBtn">اتصال به بازی</button>
        </div>
      </div>
      <div class="panel" style="margin-top:14px;">
        <h3 style="margin:0 0 10px; font-size:14px;">بازی‌های آنلاین الان</h3>
        <p class="hint" style="margin-top:0; color:var(--accent-deep);">⚠️ ممکنه برای دیدن و استفاده از این بخش نیاز داشته باشی فیلترشکن (VPN) رو روشن کنی.</p>
        <input type="text" id="roomSearchInput" placeholder="جست‌وجو بر اساس عنوان بازی…" value="${escapeHtml(roomsSearchTerm)}">
        <div id="roomsListContainer" style="margin-top:12px;">${roomsListHtml()}</div>
        ${fbReady ? '' : `<p class="hint">این بخش هنوز فعال نشده؛ باید تنظیمات Firebase بالای کد پر بشه.</p>`}
      </div>
    `;
    document.getElementById('tabCreate').onclick = ()=>{
      document.getElementById('tabCreate').classList.add('active');
      document.getElementById('tabJoin').classList.remove('active');
      document.getElementById('paneCreate').style.display = '';
      document.getElementById('paneJoin').style.display = 'none';
    };
    document.getElementById('tabJoin').onclick = ()=>{
      document.getElementById('tabJoin').classList.add('active');
      document.getElementById('tabCreate').classList.remove('active');
      document.getElementById('paneJoin').style.display = '';
      document.getElementById('paneCreate').style.display = 'none';
    };
    document.getElementById('createBtn').onclick = createGame;
    document.getElementById('joinBtn').onclick = joinGame;
    document.getElementById('roomSearchInput').oninput = (e)=>{
      roomsSearchTerm = e.target.value;
      renderRoomsList(); // فقط لیست را آپدیت کن، نه کل صفحه (تا نوشتن توی جست‌وجو پاک نشه)
    };
    bindRoomsListButtons();
    startWatchingRooms();
  }

  // فقط بخش لیست بازی‌های آنلاین را از نو می‌سازد، بدون دست‌زدن به بقیه‌ی فرم لندینگ
  function renderRoomsList(){
    const el = document.getElementById('roomsListContainer');
    if(el) el.innerHTML = roomsListHtml();
    bindRoomsListButtons();
  }

  function bindRoomsListButtons(){
    document.querySelectorAll('button[data-room-code]').forEach(btn=>{
      btn.onclick = ()=> joinRoomByCode(btn.getAttribute('data-room-code'));
    });
  }

  function roomsListHtml(){
    const term = norm(roomsSearchTerm);
    const entries = Object.keys(onlineRooms).map(code=>({code, ...onlineRooms[code]}))
      .filter(r=> !term || norm(r.title||'').indexOf(term) !== -1)
      .sort((a,b)=> (b.lastUpdate||0)-(a.lastUpdate||0));

    if(!fbReady) return '';
    if(entries.length === 0){
      return `<p class="status-line" style="margin-top:0;">الان هیچ بازی آنلاینی پیدا نشد.</p>`;
    }
    const phaseLabel = { lobby:'در لابی، قابل ورود', countdown:'الان شروع می‌شود', playing:'درحال بازی', reveal:'بین دو دور' };
    return entries.map(r=>`
      <div class="player-row">
        <span class="name" style="flex-direction:column; align-items:flex-start; gap:2px; white-space:normal;">
          <strong>${escapeHtml(r.title||'بدون عنوان')}</strong>
          <span style="color:var(--muted); font-size:12px;">میزبان: ${escapeHtml(r.hostName||'؟')} · ${r.playerCount||0} نفر · ${phaseLabel[r.phase] || r.phase || ''}</span>
        </span>
        <button class="btn-ghost" data-room-code="${escapeHtml(r.code)}" style="padding:7px 12px; font-size:12.5px; flex:none;">پیوستن</button>
      </div>
    `).join('');
  }

  function renderConnecting(){
    root.innerHTML = '<div class="panel">در حال اتصال…</div>';
  }

  function sidebarHtml(){
    const rows = Object.keys(state.players).map(id=>({id, ...state.players[id]})).sort((a,b)=>(b.score||0)-(a.score||0));
    const colors = ['#7C2D3A','#33513F','#C4872A','#2F4B7C','#6B4C9A','#B5473A'];
    const showReady = (state.phase === 'lobby' || state.phase === 'countdown');
    return `
      <div class="panel side">
        <h3>بازیکنان (${rows.length})</h3>
        ${rows.map((p,i)=>`
          <div class="player-row">
            <span class="name"><span class="dot" style="background:${colors[i%colors.length]}"></span>${escapeHtml(p.name||'بازیکن')}${p.id===myId?' (شما)':''}${showReady ? (p.ready ? ' ✅' : ' ⏳') : ''}</span>
            <span class="score">${p.score||0}</span>
          </div>
        `).join('') || '<div class="status-line">هنوز کسی نیست.</div>'}
        <p class="hint">جواب یکتا = ۱۰ امتیاز، جواب مشترک = ۵ امتیاز، خالی یا غلط = صفر.</p>
      </div>`;
  }

  function renderLobby(){
    const rows = Object.keys(state.players).map(id=>({id, ...state.players[id]}));
    const readyCount = rows.filter(p=>p.ready).length;
    const myReady = !!(state.players[myId] && state.players[myId].ready);
    root.innerHTML = `
      <div class="layout">
        <div class="panel">
          <span class="badge">لابی</span>
          ${isHost ? `
            <p class="status-line" style="margin-top:0;">کد بازی — این را برای دوستانت بفرست:</p>
            <div class="code-box">${escapeHtml(myId||'')}</div>
          ` : `<p class="status-line" style="margin-top:0;">وصل شدی، ${escapeHtml(state.players[myId]?state.players[myId].name:'')} 👋</p>`}
          <p class="status-line">${readyCount} از ${rows.length} نفر آماده‌اند. وقتی همه آماده باشند، بازی خودش با شمارش معکوس شروع می‌شود.</p>
          <div style="margin-top:14px;">
            <button class="btn-primary" id="readyBtn">${myReady ? 'لغو آماده‌بودن' : 'آماده‌ام ✓'}</button>
          </div>
        </div>
        ${sidebarHtml()}
      </div>
    `;
    document.getElementById('readyBtn').onclick = toggleReady;
  }

  function renderCountdown(){
    if(!countdownInterval){
      countdownInterval = setInterval(()=>{
        if(state.phase === 'countdown') renderCountdown();
      }, 200);
    }
    const remain = Math.max(0, (state.countdownEndsAt||0) - Date.now());
    const n = Math.ceil(remain/1000);
    root.innerHTML = `
      <div class="layout">
        <div class="panel" style="text-align:center;">
          <span class="badge">آماده باش!</span>
          <div style="font-size:64px; font-weight:800; color:var(--brand); margin:18px 0;">${n>0?n:'برو!'}</div>
          <p class="status-line">بازی الان شروع می‌شود…</p>
        </div>
        ${sidebarHtml()}
      </div>
    `;
  }

  // فقط وقتی دور عوض شده (یا اولین‌بار وارد صفحه‌ی بازی می‌شویم) فرم را کامل می‌سازیم؛
  // در غیر این صورت فقط بخش‌های متغیر را به‌روزرسانی می‌کنیم (updatePlayingDynamic).
  function renderPlayingSmart(){
    if(playingRoundKey !== state.roundNum){
      playingRoundKey = state.roundNum;
      if(timerInterval) clearInterval(timerInterval);
      buildPlayingSkeleton();
      timerInterval = setInterval(updatePlayingDynamic, 250);
    }
    updatePlayingDynamic();
  }

  function buildPlayingSkeleton(){
    root.innerHTML = `
      <div class="layout">
        <div class="panel">
          <div class="play-head">
            <div class="letter-chip">${state.letter}</div>
            <div>
              <div class="status-line" style="margin-top:0;">دور ${state.roundNum}</div>
              <div class="timer" id="timerBox">-- ثانیه</div>
            </div>
          </div>
          <p class="status-line" style="margin-top:0; margin-bottom:14px; font-weight:700; color:var(--ink);">
            حرف این دور «${state.letter}» است — هر ۶ کادر زیر را با یک کلمه که با همین حرف شروع می‌شود پر کن.
          </p>
          <div class="cat-grid">
            ${CATEGORIES.map(c=>`
              <div class="cat-row">
                <label for="cat_${c.key}">${c.label}</label>
                <input type="text" id="cat_${c.key}" ${submittedThisRound?'disabled':''} autocomplete="off" placeholder="کلمه‌ای با حرف ${state.letter}">
              </div>
            `).join('')}
          </div>
          <div style="margin-top:14px; display:flex; gap:10px; align-items:center;">
            <button class="btn-primary" id="submitBtn" ${submittedThisRound?'disabled':''}>${submittedThisRound?'ارسال شد ✓':'ارسال جواب‌ها'}</button>
            <span class="status-line" style="margin-top:0;" id="submittedCount">${Object.keys(state.answers).length} نفر ارسال کرده‌اند</span>
          </div>
        </div>
        <div id="sideSlot">${sidebarHtml()}</div>
      </div>
    `;
    document.getElementById('submitBtn').onclick = submitAnswers;
  }

  function updatePlayingDynamic(){
    const remain = Math.max(0, state.deadline - Date.now());
    const secs = Math.ceil(remain/1000);
    const timerBox = document.getElementById('timerBox');
    if(timerBox){
      timerBox.textContent = secs + ' ثانیه';
      timerBox.className = 'timer' + (secs<=10?' low':'');
    }
    const countEl = document.getElementById('submittedCount');
    if(countEl) countEl.textContent = Object.keys(state.answers).length + ' نفر ارسال کرده‌اند';
    const sideSlot = document.getElementById('sideSlot');
    if(sideSlot) sideSlot.innerHTML = sidebarHtml();
  }

  function renderReveal(){
    const letter = state.letter;
    const playerIds = Object.keys(state.players);
    const rows = CATEGORIES.map(cat=>{
      const words = playerIds.map(pid=> (state.answers[pid] && state.answers[pid].categories && state.answers[pid].categories[cat.key]) || '');
      const cells = playerIds.map((pid,i)=>{
        const w = words[i];
        const pts = pointsFor(w, letter, words);
        const cls = pts===10?'pt-10':(pts===5?'pt-5':'pt-0');
        return `<td class="${cls}">${escapeHtml(w)||'—'}${w?`<br><small>${pts} امتیاز</small>`:''}</td>`;
      }).join('');
      return `<tr><th>${cat.label}</th>${cells}</tr>`;
    }).join('');
    const header = playerIds.map(pid=>`<th>${escapeHtml(state.players[pid]?state.players[pid].name:'؟')}</th>`).join('');

    root.innerHTML = `
      <div class="layout">
        <div class="panel">
          <span class="badge">نتیجه دور ${state.roundNum} — حرف «${letter}»</span>
          <div style="overflow-x:auto;">
            <table class="score-table"><thead><tr><th></th>${header}</tr></thead><tbody>${rows}</tbody></table>
          </div>
          <div style="margin-top:16px;"><button class="btn-primary" id="nextBtn">دور بعدی</button></div>
        </div>
        ${sidebarHtml()}
      </div>
    `;
    document.getElementById('nextBtn').onclick = requestNextRound;
  }

  window.addEventListener('beforeunload', ()=>{
    if(isHost) unregisterRoomFromDirectory();
  });

  if(typeof Peer === 'undefined'){
    root.innerHTML = '<div class="panel">کتابخانهٔ اتصال (PeerJS) بارگذاری نشد — اتصال اینترنت را بررسی کنید و صفحه را رفرش کنید.</div>';
  } else {
    render();
  }
</script>
</body>
</html>
